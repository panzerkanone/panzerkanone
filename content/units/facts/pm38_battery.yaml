    bomb_mass_kg:
      value: 15.9
      unit: kg
      source: wp-en-m1938-mortar
      locator: "Shells specifications table (Firing tables TS No. 104, 1967): 53-OF-843 HE/FRAG, 15.9 kg, max range 5.7 km"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 16.2, unit: kg, source: wp-en-m1938-mortar, locator: "same table, 53-F-843 HE, 16.2 kg, max range 4.1 km", retrieved: 2026-11-11, confidence: verified}
        - {value: 16, unit: kg, source: wp-en-m1938-mortar, locator: "infobox cartridge 16 kg", retrieved: 2026-11-11, confidence: verified}
