schema: unit-facts/1
id: pm38_battery
designation: 120-PM-38
full_name: 120 mm regimental mortar M1938 (120-PM-38), regimental mortar battery
side: soviet
kind: mortar
setting: Eastern Front, 1943 (the improved 120-PM-43 entered service in 1943; see note on min range)
facts:
  count_per_unit:
    value: 6
    unit: mortars
    source: wp-ru-rifle-regt
    locator: "1942: 'в полку — батарея 120-мм миномётов (6 миномётов). Позднее, приказом НКО № 306 от 8 октября 1942 года такая практика была официально закреплена.'"
    retrieved: 2026-11-11
    confidence: secondary
    note: "establishment tables not opened (TM 30-430 Chapter III, which should cover this, was blocked: digitalcommons.unl.edu returned 403)"
    alternatives:
      - {value: 7, unit: mortars, source: wp-ru-rifle-regt, locator: "1942-1944, shtat 04/551 of 10 December 1942: 'в миномётной батарее полка добавился один 120-мм миномёт, таким образом их стало 7'", retrieved: 2026-11-11, confidence: secondary, note: "the same article; the seventh mortar may be a reserve or a reading error, unconfirmed"}
      - {value: 6, unit: mortars, source: wp-ru-rifle-regt, locator: "Guards shtat 05/41 of 18 December 1944: 'Миномётная батарея 120-мм миномётов стала состоять из 6 миномётов'", retrieved: 2026-11-11, confidence: secondary}
      - {value: 8, unit: mortars, source: wp-ru-rifle-regt, locator: "Guards rifle regiment shtat 04/501 (December 1942): 'количество полковых миномётов тоже было увеличено до 8'", retrieved: 2026-11-11, confidence: secondary}
    preferred: "6 (the brief's figure and the October 1942 order); 7 under the December 1942 regimental table is the main open question"

  mortar:
    designation: {value: "120-PM-38 (M1938)", unit: name, source: wp-en-m1938-mortar, locator: "infobox name 120-PM-38", retrieved: 2026-11-11, confidence: verified}
