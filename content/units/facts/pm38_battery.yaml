    max_range_m:
      value: 5700
      unit: m
      source: wp-en-m1938-mortar
      locator: "Shells table, OF-843 max range 5.7 km; infobox range 6 km (Chamberlain and Gander 1975, p. 32)"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 5900, unit: m, source: wp-ru-pm38, locator: "Максимальная дальность, м = 'до 5900'; Эффективная дальность '460 — 5700'", retrieved: 2026-11-11, confidence: verified}
        - {value: 6000, unit: m, source: wp-en-m1938-mortar, locator: "infobox range 6 km", retrieved: 2026-11-11, confidence: verified}
      preferred: "5700 with the OF-843 bomb"
    min_range_m:
      value: 460
      unit: m
      source: wp-ru-pm38
      locator: "Эффективная дальность, м = '460 — 5700'"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 500, unit: m, source: wp-en-pm43, locator: "infobox range: '5700 m maximum, 500 m minimum' (the 120-PM-43)", retrieved: 2026-11-11, confidence: verified, note: "the research used this"}
      preferred: "460 for the M1938; 500 for the M1943. One hex either way at 250 m per hex"
    max_rate_rpm:
      value: 10
      unit: rounds per minute
      source: wp-en-m1938-mortar
      locator: "infobox rate: 10 rpm"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 15, unit: rounds per minute, source: wp-ru-pm38, locator: "Скорострельность, выстр/мин = 'до 15'; text 'Скорострельность достигала 15 выстрелов в минуту'", retrieved: 2026-11-11, confidence: verified}
        - {value: 9, unit: rounds per minute, source: wp-en-pm43, locator: "infobox rate: '9 rpm maximum, 70 rds/hr sustained' (120-PM-43)", retrieved: 2026-11-11, confidence: verified}
      preferred: "10. The 15 is a peak; the research halves the published maximum, so 10 gives 5 a minute and 15 would give 7.5, a 50% swing in mortar HE. Flag for the deriver"

