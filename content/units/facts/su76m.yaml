schema: unit-facts/1
id: su76m
designation: SU-76M
full_name: SU-76M light self-propelled gun (factory index SU-15M), 76.2 mm ZiS-3Sh
side: soviet
kind: self_propelled_gun
setting: "Eastern Front, second half of 1943 (SU-15M adopted as SU-76M in July 1943, wider production from autumn 1943; wp-en-su76, SU-76M)"
facts:
  count_per_unit:
    value: 4
    unit: self-propelled guns
    source: wp-ru-sap
    locator: "1943 table: light SAP, shtat 010/456 (April 1943): 'взвод управления (одна СУ-76, командира полка)' and '1-я ... 5-я батарея (четыре СУ-76)' (Kolomiets and Makarov, Frontovaya Illyustratsiya 4/2002)"
    retrieved: 2026-11-11
    confidence: secondary
    note: "the text says light regiments had 'по 20 САУ СУ-76 (пять батарей по четыре САУ)'"
    alternatives:
      - {value: 5, unit: self-propelled guns, source: wp-ru-sap, locator: "1944 table: light SAP, shtat 010/484 (October 1943): regiment commander's SU-76 plus batteries of 'пять СУ-76'", retrieved: 2026-11-11, confidence: secondary, note: "21 per regiment either way; wp-en-su76: 'each light self-propelled artillery regiment was equipped with 21 SU-76Ms' (Chubachin 2009, p. 80); 1944-45 divisional battalions of 16 (wp-en-su76)"}
    preferred: "4 for April-October 1943, 5 from October 1943. Pick by scenario date"

