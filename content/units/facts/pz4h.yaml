schema: unit-facts/1
id: pz4h
designation: Pz IV H
full_name: Panzerkampfwagen IV Ausf. H (Sd.Kfz. 161/2)
side: german
kind: tank
setting: Eastern Front, 1943 (Ausf. H in production from June 1943)
facts:
  count_per_unit:
    value: 5
    unit: tanks
    source: tme30-451-hw
    locator: "Chapter II, Figure 100, SS Tank Company: each 'Tk Plat' row, Pz. Kpfw. IV's or V's = 5"
    retrieved: 2026-11-11
    confidence: verified
    note: >-
      Figure 100 is the 1944-45 SS company (2 HQ + 3 platoons of 5 = 17). The same handbook's Army
      company, Figure 93, has platoons of 4 (2 HQ + 3 x 4 = 14). A 1943 Army company of 22 tanks
      (2 HQ + 4 platoons of 5) under K.St.N. 1175 appears in web-search summaries only; no page
      showing the table was opened, so it is not recorded as a fact.
    alternatives:
      - value: 4
        unit: tanks
        source: tme30-451-hw
        locator: "Chapter II, Figure 93, Tank Company, Army Armored Division: each 'Tk Plat' row = 4; total 14"
        retrieved: 2026-11-11
        confidence: verified
    preferred: >-
      5, because the lead's ruling 8 (docs/bars/M2a.md) sets German platoons of five and a public
      handbook table supports a five-tank platoon; the Army four-tank platoon is the other encoding.

  gun:
    designation: {value: "7.5 cm KwK 40 L/48", unit: name, source: wp-en-panzer-iv, locator: "infobox, primary_armament: '7.5 cm KwK 40 L/48 main gun (87 rounds)'", retrieved: 2026-11-11, confidence: verified}
    calibre_mm: {value: 75, unit: mm, source: wp-en-kwk40, locator: "infobox, caliber = 75 mm", retrieved: 2026-11-11, confidence: verified}
    ap_round: {value: "Pzgr. Patr. 39 KwK 40 (APCBC)", unit: name, source: wp-en-kwk40, locator: "Ammunition table, first row", retrieved: 2026-11-11, confidence: verified, note: "the standard full-calibre armour-piercing round of 1943; the tungsten-cored Pzgr. 40 was scarce (wp-de-pz4, note under the ammunition table)"}
    ap_shot_origin: {value: german_capped, unit: category, source: wp-en-kwk40, locator: "Ammunition list: 'Armour-piercing, capped, ballistic capped shell (APCBC)'", retrieved: 2026-11-11, confidence: verified}
    ap_shot_mass_kg: {value: 6.8, unit: kg, source: wp-en-kwk40, locator: "Ammunition table, Pzgr. Patr. 39 KwK 40, projectile weight 6.8 kg", retrieved: 2026-11-11, confidence: verified}
    ap_muzzle_velocity_ms:
      value: 750
      unit: m/s
      source: wp-en-kwk40
      locator: "Ammunition table, Pzgr. Patr. 39 KwK 40, muzzle velocity 750 m/s"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 790, unit: m/s, source: wp-de-pz4, locator: "Panzergranaten table, L/48 column, 'Mündungsgeschwindigkeit 790 (Pzgr.)'", retrieved: 2026-11-11, confidence: verified}
      preferred: >-
        750: the KwK 40 article's sourced ammunition table and the Pak 40 article ('750 m/s for the
        L/48') agree, and 790 m/s is the Pak 40's figure with its longer case. The research also
        calibrates its penetration constant on 750 m/s.
    he_round: {value: "7.5 cm Sprgr. Patr. 34 (HE)", unit: name, source: wp-en-kwk40, locator: "Ammunition list and table", retrieved: 2026-11-11, confidence: verified}
    he_shell_mass_kg:
      value: 5.76
      unit: kg
      source: tme30-451-hw
      locator: "Chapter VII, Section V, 2.a, Stu. G. III fuer 7.5 cm Stu. K. 40 (L/48), ammunition table: HE projectile weight 12.7 pounds (converted at 0.4536 kg/lb)"
      retrieved: 2026-11-11
      confidence: verified
      note: "the StuK 40 L/48 is the same gun as the KwK 40 L/48 (wp-en-kwk40, History); no shell weight is given in the handbook's own Pz IV entry"
      alternatives:
        - {value: 5.69, unit: kg, source: tme30-451-hw, locator: "Chapter VII, Section IV, 6.e, 7.5 cm Pak 40, Ammunition: 'HE, 12.54 pounds'", retrieved: 2026-11-11, confidence: verified, note: "Pak 40 round; same Sprgr. 34 projectile family with a longer case"}
        - {value: 4.42, unit: kg, source: wp-en-kwk40, locator: "Ammunition table, 7.5 cm Sprgr.Patr.34, projectile weight '9.75 lb'", retrieved: 2026-11-11, confidence: verified, note: "cites War Office, Handbook of Enemy Ammunition, Pamphlet 7, 1943 (not opened). Out of line with both handbook figures; possibly a transcription error"}
      preferred: "5.76 kg (12.7 lb): the handbook figure for this exact gun; 5.69 kg is within 1.3%."

  machine_guns:
    count: {value: 2, unit: guns, source: wp-en-panzer-iv, locator: "infobox, secondary_armament: '2 x 7.92 mm MG 34'", retrieved: 2026-11-11, confidence: verified}
    type: {value: "MG 34, one coaxial, one in hull ball mount", unit: name, source: tme30-451-ls, locator: "Specifications (Model G): 'One 7.5 cm Kw.K.40 (L/43) and one M.G.34' in turret; 'One M.G.34' in hull", retrieved: 2026-11-11, confidence: verified}

