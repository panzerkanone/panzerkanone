      angle_from_vertical_deg: {value: 10, unit: degrees, source: wp-de-pz4, locator: "'80°' from horizontal", retrieved: 2026-11-11, confidence: verified}
      cast: {value: false, unit: boolean, source: wp-de-pz4, locator: "rolled plate", retrieved: 2026-11-11, confidence: verified}
