  mortar:
    designation: {value: "12 cm Granatwerfer 42", unit: name, source: tme30-451-hw, locator: "Chapter VII, Section III, 4.d '120-MM MORTAR (12 cm Granatenwerfer 42)'; 'a virtually exact German copy of a standard Russian weapon'", retrieved: 2026-11-11, confidence: verified}
