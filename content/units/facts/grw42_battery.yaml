    max_range_m:
      value: 6000
      unit: m
      source: wp-en-grw42
      locator: "infobox max_range: '6 km' (Chamberlain and Gander, Mortars and Rockets, 1975, p. 9)"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 6035, unit: m, source: tme30-451-hw, locator: "Chapter VII, Section III, 4.d (2): 'Maximum range 6,600 yards'", retrieved: 2026-11-11, confidence: verified}
        - {value: 6185, unit: m, source: qms-grw42, locator: "'Maximum Range 6.185m'", retrieved: 2026-11-11, confidence: secondary}
        - {value: 650, unit: m, source: wp-de-grw42, locator: "Maximale Schussweite = 650", retrieved: 2026-11-11, confidence: verified, note: "evidently a dropped digit (6,050 m appears in mirrors of the English article); do not use"}
      preferred: "6000; the handbook's 6035 agrees to 1%"
    min_range_m:
      value: 600
      unit: m
      source: qms-grw42
      locator: "'Minimum Range 600m'"
      retrieved: 2026-11-11
      confidence: secondary
      note: >-
        Only source found, and it cites nothing. The Soviet original fires from 460 m (wp-ru-pm38,
        'Эффективная дальность 460 — 5700'), and the research used 500 m from the 120-PM-43. A
        handbook source for the German minimum is a gap.
    max_rate_rpm:
      value: 10
      unit: rounds per minute
      source: wp-en-grw42
      locator: "infobox rate: '8-10 rpm'; the upper figure is the maximum"
      retrieved: 2026-11-11
      confidence: verified
      note: "the source prints a range, 8 to 10; this entry is the maximum rate, which is its upper end"
      alternatives:
        - {value: "8-10", unit: rounds per minute, source: wp-de-grw42, locator: "Kadenz = 8-10", retrieved: 2026-11-11, confidence: verified}
        - {value: 12, unit: rounds per minute, source: qms-grw42, locator: "'Maximum Rate of Fire 12 r.p.m.'; 'Practical Rate of Fire 5 r.p.m.'", retrieved: 2026-11-11, confidence: secondary}
      preferred: "10, the maximum (the research halves the published maximum for mortars, which gives 5 a minute, the practical rate the secondary source states). Lead's ruling, 2026-11-11; until then the entry's value was the range as printed"
    muzzle_velocity_ms: {value: 283, unit: m/s, source: wp-de-grw42, locator: "Mündungsgeschwindigkeit_V0 = 283", retrieved: 2026-11-11, confidence: verified, note: "not a formula input for mortars", alternatives: [{value: 280, unit: m/s, source: wp-en-grw42, locator: "infobox velocity 280 m/s", retrieved: 2026-11-11, confidence: verified}]}

