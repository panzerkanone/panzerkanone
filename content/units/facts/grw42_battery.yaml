      locator: "infobox cartridge: '15.6 kg bomb'"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 15.9, unit: kg, source: tme30-451-hw, locator: "Chapter VII, Section III, 4.d (2): 'Weight of shell 35 pounds'", retrieved: 2026-11-11, confidence: verified}
        - {value: 15.6, unit: kg, source: wp-de-grw42, locator: "Geschossgewicht = 'Sprenggranate 15,6'; text: German and Soviet HE bombs of 15.6 kg (Gander and Chamberlain, p. 302)", retrieved: 2026-11-11, confidence: verified}
        - {value: 15.8, unit: kg, source: qms-grw42, locator: "'Round Weight HE: 15.8 kg'", retrieved: 2026-11-11, confidence: secondary}
