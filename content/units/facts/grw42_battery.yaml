  platoon_men:
    value: 47
    unit: men
    source: tme30-451-hw
    locator: "Figure 37, 120-mm mortar platoon (Mtz): Offs 1, NCOs 7, Pvts 39; Rs or Cbns 36, Pistols 5, Sub-MGs 7, LMGs 2"
    retrieved: 2026-11-11
    confidence: verified
  organic_transport:
    value: "motorised: 7 motor vehicles and 2 motorcycles in the platoon"
    unit: description
    source: tme30-451-hw
    locator: "Figure 37, 120-mm mortar platoon (Mtz): Mtr Vehicles 7, Mtrcls 2"
    retrieved: 2026-11-11
    confidence: verified
