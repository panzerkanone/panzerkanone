    ap_muzzle_velocity_ms:
      value: 790
      unit: m/s
      source: wp-en-pak40
      locator: "PzGr. 39: 'Muzzle velocity: 790 m/s'"
      retrieved: 2026-11-11
      confidence: verified
      alternatives:
        - {value: 792, unit: m/s, source: wp-en-pak40, locator: "table 'Penetration of armour 90 degrees incidence at 500 m' (marked citation needed): 792 m/s", retrieved: 2026-11-11, confidence: verified}
        - {value: 770, unit: m/s, source: wp-en-pak40, locator: "'the Official Firing Table document for the 75 mm KwK 40, StuK 40 and the Pak 40 dated October, 1943, gives 770 m/s on one of the APCBC tables'", retrieved: 2026-11-11, confidence: verified}
        - {value: 776, unit: m/s, source: wp-en-pak40, locator: "'The first documented firing by the US of a Pak 40 recorded an average muzzle velocity of 776 m/s'", retrieved: 2026-11-11, confidence: verified}
        - {value: 771, unit: m/s, source: tme30-451-hw, locator: "Chapter VII, Section IV, 6.e (2): 'Muzzle velocity (APCBC) 2,530 feet per second'", retrieved: 2026-11-11, confidence: verified}
      preferred: >-
        790 (the article's ammunition section). The research used 792. A measured 770-776 m/s
        (German October 1943 firing table, US test, the handbook) is 2-3% lower; penetration goes as
        velocity^1.43, so the choice moves penetration by up to 4%. Record which one the deriver uses.
    he_round: {value: "7.5 cm Sprgr. 34 (HE)", unit: name, source: tme30-451-hw, locator: "Chapter VII, Section IV, 6.e (3): 'Weights of projectiles fired from this gun are: HE, 12.54 pounds'", retrieved: 2026-11-11, confidence: verified, note: "the handbook does not name the shell; Sprgr. 34 is the 75 mm HE shell named in wp-en-kwk40"}
