    rate_of_fire_rpm: {value: 14, unit: rounds per minute, source: wp-en-pak40, locator: "infobox rate: '14 rounds per minute'", retrieved: 2026-11-11, confidence: verified, note: "nominal rate; the research derives a practical rate instead (section 2.6, 3.2). Recorded for reference only", alternatives: [{value: 15, unit: rounds per minute, source: wp-de-pak40, locator: "Kadenz = 15", retrieved: 2026-11-11, confidence: verified}]}

