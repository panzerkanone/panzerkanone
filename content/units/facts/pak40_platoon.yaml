    he_muzzle_velocity_ms: {value: 549, unit: m/s, source: tme30-451-hw, locator: "'Muzzle velocity (HE). 1,800 feet per second'", retrieved: 2026-11-11, confidence: verified, note: "wp-en-pak40 table gives HE 550 m/s"}
