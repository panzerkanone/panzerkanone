  kind: primary (wartime US intelligence)
  licence: US government work, public domain
  retrieved: 2026-11-11

ttt25-1943:
  title: "Military Intelligence Service, Tactical and Technical Trends No. 25, 20 May 1943, 'Notes on Russian and Japanese Animal-Drawn Transport'"
  host: Lone Sentry
