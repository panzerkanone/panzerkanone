  kind: primary (wartime US intelligence)
  licence: US government work, public domain
  retrieved: 2026-11-11

ib-1943-07:
  title: "Military Intelligence Service, Intelligence Bulletin, July 1943, '75-mm Assault Artillery'"
  host: Lone Sentry
