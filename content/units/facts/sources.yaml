  kind: primary (wartime US intelligence)
  licence: US government work, public domain
  retrieved: 2026-11-11

ttt22-1943:
  title: "Military Intelligence Service, Tactical and Technical Trends No. 22, 8 April 1943, 'Observations on German Employment of Armored Infantry' (translated from a German training manual)"
  host: Lone Sentry
