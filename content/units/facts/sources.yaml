gtd-1942:
  title: "Military Intelligence Service, Special Series No. 8, German Tactical Doctrine, 20 December 1942, Section X, Marches"
  host: Lone Sentry
  url: https://lonesentry.com/manuals/german-tactical-doctrine/marches.html
  kind: primary (wartime US intelligence, a digest of German doctrine)
  licence: US government work, public domain
  retrieved: 2026-11-11

fme101-10-1942:
  title: "War Department, FM-E 101-10, Staff Officers' Field Manual: Enemy Forces, Organization, Technical, and Logistical Data, 1 October 1942"
  host: scan hosted by patcosta.com (a private site hosting the government PDF; nothing of the site's own is used)
  url: https://patcosta.com/wp-content/uploads/2024/07/FM-E-101-10-Staff-Officers-Field-Manual-Enemy-Forces-Organization-Technical-and-Logistical-Data-Oct-1942.pdf
  kind: primary (wartime US intelligence; its foreword says 'Much of the data herein are not exact values')
  licence: US government work, public domain
  retrieved: 2026-11-11
  note: "page numbers are the PDF's; the OCR text layer is partly garbled, and figures were read where the layer is legible"

fm101-10-1941:
  title: "War Department, FM 101-10, Staff Officers' Field Manual: Organization, Technical, and Logistical Data, 1941, paragraph 38, Rates and Lengths of Marches"
  host: HyperWar at ibiblio (PDF scan)
  url: https://ibiblio.org/hyperwar/USA/ref/FM/PDFs/FM101-10.pdf
  kind: primary (US doctrine for US units; used only where no German or Soviet figure was found)
  licence: US government work, public domain
  retrieved: 2026-11-11
  note: "the table on printed pages 82-83 was read from the page images, because the OCR layer garbles the fractions"

coeo-1945:
  title: "US Office of the Chief of Ordnance, Catalog of Enemy Ordnance Materiel, 1945, 'm. gp. Mannsch. Kw. (Sd. Kfz. 251): Medium Armored Personnel Carrier', German section p. 45"
  host: Lone Sentry transcription, read in the Internet Archive snapshot of 6 December 2019 (the live site returned only server warnings)
  url: https://web.archive.org/web/20191206030550/http://www.lonesentry.com/ordnance/tag/sdkfz-251
  kind: primary (wartime US technical intelligence)
  licence: US government work, public domain
  retrieved: 2026-11-11
  note: "angles are printed 'to the horizontal'; recorded from the vertical as 90 minus the printed figure"

