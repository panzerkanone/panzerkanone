# Source registry for content/units/facts/*.yaml. Every `source:` key in a facts file is a key here.
# Shape and confidence marks: see README.md in this folder.
# revision: the page revision current when read (Wikipedia), so a later reader can open the same text.
# licence: the basis on which the facts are used. Facts are not copyrightable (US Copyright Office,
#   FAQ and Circular 33, cited in docs/research/2026-11/research-history-data.md section 2.1); no
#   prose or table layout from any source is copied into the game.

# --- US government works (public domain in the US, 17 U.S.C. 105) ---------------------------------

tme30-451-hw:
  title: "War Department, TM-E 30-451, Handbook on German Military Forces, 15 March 1945"
  host: HyperWar transcription at ibiblio
  urls:
    chapter_II: https://www.ibiblio.org/hyperwar/Germany/HB/HB-2.html
    chapter_VI: https://www.ibiblio.org/hyperwar/Germany/HB/HB-6.html
    chapter_VII: https://www.ibiblio.org/hyperwar/Germany/HB/HB-7.html
    chapter_VIII: https://www.ibiblio.org/hyperwar/Germany/HB/HB-8.html
  kind: primary (wartime US intelligence; technical data sometimes wrong, see research 2.6)
  licence: US government work, public domain
  retrieved: 2026-11-11

tme30-451-ls:
  title: "War Department, TM-E 30-451, 1945, Chapter VII, Section VI, 3. Medium Tanks (Pz. Kpfw. IV)"
  host: Lone Sentry transcription
  url: https://lonesentry.com/manuals/tme30/ch7sec6sub3.html
  kind: primary
  licence: US government work, public domain
  retrieved: 2026-11-11

ttt19-1943:
