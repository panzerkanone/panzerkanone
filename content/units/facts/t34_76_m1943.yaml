      preferred: "54, the figure given for the 1943 tank; 53 is 2% lower and changes nothing"
    engine_power: {value: 500, unit: hp, source: wp-en-t34, locator: "infobox engine_power: '500 hp (370 kW)', V-2-34 diesel", retrieved: 2026-11-11, confidence: verified, note: "wp-ru-t34 table, all models: 'В-2, 500 л. с.'"}
    combat_weight_t: {value: 30.9, unit: t, source: wp-en-t34, locator: "comparison table, T-34 Model 1943, weight 30.9 tonne", retrieved: 2026-11-11, confidence: verified, note: "wp-ru-t34 TTX table, T-34 обр. 1943, Боевая масса 30,9"}

  crew:
