    in_turret: {value: 2, unit: men, source: wp-en-t34, locator: "'The two-man turret crew arrangement required the commander to aim and fire the gun'; Model 1943 turret 'still two-man'", retrieved: 2026-11-11, confidence: verified}
    rate_note: {value: "German tanks 'could typically get off three rounds for every one fired by the T-34'", unit: quotation, source: wp-en-t34, locator: "Design, crew compartment paragraph (Zaloga 1994, p. 40)", retrieved: 2026-11-11, confidence: verified, note: "context for the research's two-man-turret factor; not itself an input"}

