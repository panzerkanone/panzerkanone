# Crossroads at Holtargard: the first scenario for play of Formation Impulse (rules v1,
# revision 2). Two invented forces of the placeholder unit types, four formations a side,
# each with a half-track and a truck (one rifle company a side starts carried, 4.1), meet
# across the standard test board for its town of Holtargard (1813), the hill at 1810 and the
# woods at 2110. The forces and their set-up are those of the ruleset's own test scenario;
# the ending is the one the rules give (8 turns; break at half a side's cost and sudden death
# at a lead of 12 are the rules data's own, section 19). Original content; the map and its
# place names are the generated test board's. Checked on load by the ruleset's own scenario
# check (format impulse-scenario/1).
# The same scenario with a free deployment is crossroads_free.scenario.yaml; on the board
# whose woods are tree sides, crossroads_trees.scenario.yaml.

format: impulse-scenario/1
id: holtargard-crossroads
name: "Crossroads at Holtargard"
ruleset: v1
units: placeholder
map: { id: test_standard, hash: "bc56fc9b1f9dfe5471c26220d8605c5e66e90bbe3394dd24a24c8e03e6a43c5e" }
initiative: north
freeDeployment: false
objectives:
  - { hex: "1813", points: 3, holder: none }   # the town of Holtargard
  - { hex: "1810", points: 2, holder: none }   # hilltop
  - { hex: "2110", points: 2, holder: none }   # woods
ending: { turns: 8 }
