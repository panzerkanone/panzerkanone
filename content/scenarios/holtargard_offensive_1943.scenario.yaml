# Holtargard, July 1943: an offensive, the largest level of the battle (docs/rules/rules-v1.md 1.3). The
# main bodies arrive: a German armored battle group of two tank companies, heavy tanks, assault guns and two
# grenadier battalions attacks south across the whole width of the board between the two rivers, and a
# Soviet tank brigade with two tank battalions and three rifle battalions meets it around Holtargard,
# Pelarost and Hill 86. Every unit is on the board from the first turn: the rules have no reinforcements.
# Original content: the forces are invented for this scenario from the unit types of roster v1
# (content/units/v1.units.yaml, dated early July 1943, each value derived from cited public facts); the map
# is the standard test board with its woods placed as tree sides; its place names are the generated test
# board's. No historical engagement is depicted and no published scenario, order of battle or victory rule
# is followed or adapted.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md): the starting places
# were found by placing each unit, in turn, on the nearest hex to where it was meant to stand that no enemy
# unit placed so far could see.
# Levelled on 2026-11-14 between two planning opponents at `normal` (the whole side moving, the same side
# first every turn; the planning opponent that no longer throws tanks beside rifle companies): the first
# draft (two full Pz IV H companies) went 58.0% German over 100 games; with two Pz IV H platoons fewer
# (g2c, g2d), 54.0% over 200 games (47.1 to 60.8), mean last turn 10.9; ends at the turn limit 87%, by a
# break 12% (all German wins), by the lead 2%. (docs/review/M7/levels-handover.md.)
# Levelled again on 2026-11-15 for the lead's rulings 84 (a side's units are made Ready when its own turn begins) and 85
# (heavy machine-gun platoons), with the planning opponent that sets its whole side's fire discipline alike
# (docs/review/M7/levels2-handover.md): as it stood it went 19.0% German over 200 games at `normal` (14.2 to 25.0;
# measured before that change of the opponent), the attacker stalling at the turn limit. Screened on 60 games: the town
# worth 4 18.3%, 12 turns 10.0%, Hill 91 worth 3 and the wood 2 13.3%; Pelarost and Hill 86 worth 1 (they were 2) 31.7%,
# and with that the town worth 2 30.0%, MG platoons for both sides 28.3%, a kill share of 3 for 5 28.3%, the draft's two
# Pz IV H platoons back (g2c, g2d) 38.3%, and with those two T-34 platoons fewer (s2d, s2e) or a third Tiger platoon
# (g3e) 43.3% each. With all of these, this file: German share 44.5% over 200 games (37.8 to 51.4), a little under 45 (a
# third T-34 platoon fewer was begun and not measured: the time box); mean last turn 11.0; ends at the turn limit 97%
# (86:108). At `hard` on both sides 93.8% German (48 games; the German side breaks the brigade in 38; 95.8% before
# ruling 84). Forces 294 German points to 296 Soviet. The guns: the Pak 40s stand with the assault guns by the wood
# (2210, 2310), with no truck of their own; the GrW 42s are with the foot grenadiers north of the town (1805, 1804) with
# the two Opel Blitzes within two hexes (1803, 1802); the Soviet ZiS-3s are dug in about the town (2214, 1613, 2113) and
# west of Hill 86 (1920), with no truck; the PM-38s are south of the town (2017, 2018) with their ZIS-5s within two
# hexes (2019, 1918).

