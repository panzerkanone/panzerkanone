# What a player is told before the first turn (the briefing panel). No rule reads it. The forces, their
# points and the win conditions are worked out by the panel. Holtargard and this action are invented.
# Original text, written for this project.
briefing:
  title: "Holtargard"
  date: "July 1943"
  place: "the Eastern Front"
  picture: engraving-tank-riders
  background: >-
    High summer on the steppe. The fight for the crossroads at Holtargard has drawn in both sides'
    main bodies: a German armored battle group from the north, a whole Soviet tank brigade from the
    south.
  situation: >-
    By noon the battle runs from Pelarost to the wood east of Hill 91. Whoever holds the town, the two
    hills, the wood and Pelarost when the day ends has the crossroads and the road west.
  note: "The forces are of the kind that met that month; the place and this action are invented."
  sides:
    - side: german
      short: "German"
      mark: cross
      aim: "Break through to Holtargard and Pelarost, take both hills, and hold what you take."
      formations:
        - { id: g1, role: "first tank company" }
        - { id: g2, role: "tank platoons" }
        - { id: g3, role: "heavy tanks" }
        - { id: g4, role: "assault guns" }
        - { id: g5, role: "assault guns and antitank guns" }
        - { id: g6, role: "armored grenadiers" }
        - { id: g7, role: "grenadiers and mortars" }
        - { id: g8, role: "grenadiers" }
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Hold the town, the hills and Pelarost, and break the battle group against them."
      formations:
        - { id: s1, role: "first tank battalion" }
        - { id: s2, role: "second tank battalion" }
        - { id: s3, role: "heavy tanks and self-propelled guns" }
        - { id: s4, role: "first motor rifle battalion" }
        - { id: s5, role: "second motor rifle battalion" }
        - { id: s6, role: "rifle battalion" }
        - { id: s7, role: "guns and mortars" }
        - { id: s8, role: "rifle companies and gun" }
  objectives:
    - { hex: "1813", name: "Holtargard town" }
    - { hex: "1810", name: "Hill 91" }
    - { hex: "2110", name: "The wood" }
    - { hex: "1314", name: "Pelarost" }
    - { hex: "2016", name: "Hill 86" }
