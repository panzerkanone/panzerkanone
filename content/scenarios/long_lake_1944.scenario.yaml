# The Long Lake, February 1944: a meeting of two armored columns in the snow. Original content: the
# situation and the forces are invented for this scenario from the unit types of roster v1
# (content/units/v1.units.yaml, each value derived from cited public facts); the board is this
# project's own generated board "long_lake_winter" (assets/maps/long_lake_winter.map.yaml, the ground
# of "long_lake" printed for winter), and the place names are the board's own invented names.
# No historical engagement is depicted, and no published scenario, board, order of battle or
# victory rule is followed or adapted.
# A meeting engagement: a German armored battle group from Lunatal in the west and a Soviet tank
# brigade from Sorenyn in the east race for Lunafeld and Ulmau at the south end of the frozen lake.
# Each side holds its own village at the start. On a winter board (the lead's ruling 83, rules-v1
# 6.10) snow keeps the trucks to the roads, and the lake bears infantry and trucks but not tanks or
# guns. The German side moves first.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md). Battle size:
# 15 units a side, 97 points to 121.
# Levelled on 2026-11-14 between two planning opponents at `normal` (the whole side moving, the same
# side first every turn, 200 games a measure; docs/review/M7/winter2-handover.md has every measure).
# The German side, moving first, takes Lunafeld; the Soviet side takes Ulmau; most games go to the
# turn limit. With the Soviet column east of Sorenyn: 92% German. With it south of Hill 145, as here,
# and Lunafeld worth 2: 2% German (each side then scores 3 a turn for objectives, and a tie at the turn
# limit goes to the side that moves second). With Lunafeld worth 3: 63% German at the usual kill share
# (a point for every two of cost), 47.5% at two for three, 40% at one for one. This file (Lunafeld
# worth 3, three points for every five of cost): German share 49.5% (42.6 to 56.4) on seeds 1 to 200
# and 45.0% (38.3 to 51.9) on seeds 201 to 400, mean last turn 8.0. At `hard`: 54.0% German (100
# games). The German infantry crosses the ice now and then, about one move in two games.

