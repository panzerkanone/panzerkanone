# What a player is told before the first turn (the briefing panel). No rule reads it. The forces,
# their points and the win conditions are not written here: the panel works them out from the units
# above and from `ending` and `objectives`. Lunatal, Lunafeld, Ulmau, Sorenyn and this action are
# invented: the background is period color and claims no real engagement. Original text, written for
# this project.
briefing:
  title: "The Long Lake"
  date: "February 1944"
  place: "the Eastern Front"
  picture: engraving-winter-trench
  background: >-
    A thaw is a week away, but the lake is still frozen and the snow lies deep. A German battle group
    and a Soviet tank brigade are both sent to hold the road around the south end of the lake, and
    neither knows the other is coming.
  situation: >-
    The road from Lunatal in the west runs around the south end of the long lake through the village
    of Lunafeld, crosses the river at Ulmau and goes on to Sorenyn in the east. In this snow, trucks
    keep to the roads. The ice will carry infantry and trucks across the lake, but not tanks or guns.
  note: "The forces are of the kind that met that winter. The place and this action are invented."
  sides:
    - side: german
      short: "German"
      mark: cross
      aim: "Take Lunafeld and Ulmau and hold them, and keep Lunatal. You move first: get to Lunafeld before they do."
      formations:
        - { id: g1, role: "tank company" }
        - { id: g2, role: "heavy tanks" }
        - { id: g3, role: "armored infantry" }
        - { id: g4, role: "Lunatal" }
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Take Ulmau and Lunafeld and hold them, and keep Sorenyn. Their guns reach farther than yours, so close in before you fight."
      formations:
        - { id: s1, role: "tank battalion" }
        - { id: s2, role: "heavy tank and self-propelled guns" }
        - { id: s3, role: "motor rifles" }
        - { id: s4, role: "gun and mortars" }
  objectives:
    - { hex: "0716", name: "Lunatal" }
    - { hex: "1819", name: "Lunafeld" }
    - { hex: "2217", name: "Ulmau" }
    - { hex: "2814", name: "Sorenyn" }
