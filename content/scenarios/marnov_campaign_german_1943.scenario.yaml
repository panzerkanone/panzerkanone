# The Marnov Road as the third battle of the campaign "The Long Summer", German side
# (content/campaigns/long_summer_german.campaign.yaml). Original content: the forces are invented for this
# game from the unit types of roster v1; the board and its place names are the game's own (open_steppe).
# No historical engagement is depicted and no published scenario is followed.
#
# Level `campaign` (docs/review/M7/campaign/design.md): the German side is the campaign's force at full
# strength; each game draws from it what the force has left (client/src/campaign/force.ts). The Soviet side,
# the objectives and the ending are this battle's own, levelled at `normal` against the full-strength force.
# Made from the Battle level (marnov_road_1943): its board, objectives, ending and the Soviet side's starting
# places; the force stands in that level's German places.
#
# Levelled on 2026-11-14 (tools/balance/duel.ts --ai normal --ai-other normal --activation side --initiative fixed,
# with ruling 84): with the Battle level's Soviet side less one T-34 company and the KV-1 (114 points) the force won
# 49.5% on seeds 1 to 200 and 53.0% on 201 to 400, 51.3% over the 400 (46.4 to 56.1), mean last turn 6.1.

format: impulse-scenario/1
id: marnov-campaign-german-1943
name: "The Marnov Road, August 1943 (The Long Summer)"
battle: marnov
level: campaign
ruleset: v1
units: v1
map: { id: open_steppe, hash: "c36568cf7e2a57d9e6e7887fa3c9c358246309dad8053a16a4fb1059b3301454" }
initiative: german
freeDeployment: false
objectives:
  - { hex: "1808", points: 2, holder: none }   # the wood by the road
  - { hex: "2111", points: 3, holder: none }   # Hill 161
  - { hex: "2810", points: 2, holder: none }   # Marnov
ending: { turns: 8, suddenDeathLead: 40, breakShare: 0.6 }
sides:
  - id: german
    name: "German battle group"
    counters: stock-a
    orders: 3
    zone: [["0101", "1521"]]
    formations:
      # The tank company at the head of the column.
      - id: g1
        discipline: free
        units:
          - { id: g1a, type: pz4h, hex: "1310" }
          - { id: g1b, type: pz4h, hex: "1311" }
          - { id: g1c, type: tiger1e, hex: "1410" }
      # The grenadier battalion with its assault guns; one company rides the half-tracks.
      - id: g2
        discipline: free
        units:
          - { id: g2a, type: stug3g, hex: "1110" }
          - { id: g2b, type: grenadier_co, carriedBy: g2h }
          - { id: g2c, type: grenadier_co, hex: "1409" }
          - { id: g2d, type: grenadier_co, hex: "1210" }
          - { id: g2h, type: sdkfz251, hex: "1109" }
      # The support: the antitank guns on the trucks, the mortars, the machine guns.
      - id: g3
        discipline: free
        units:
          - { id: g3a, type: pak40, carriedBy: g3t }
          - { id: g3b, type: grw42, hex: "1209" }
          - { id: g3c, type: mg42, hex: "1009" }
          - { id: g3t, type: opel_blitz, hex: "1010" }
  - id: soviet
    name: "Soviet tank column"
    counters: stock-b
    orders: 3
    zone: [["2201", "3321"]]
    formations:
      # The tank battalion at the head of the column.
      - id: s1
        discipline: free
        units:
          - { id: s1a, type: t34_76, hex: "2411" }
          - { id: s1b, type: t34_76, hex: "2511" }
          - { id: s1c, type: t34_76, hex: "2611" }
          - { id: s1d, type: t34_76, hex: "2412" }
      # Self-propelled guns and motor rifles in trucks.
      - id: s2
        discipline: free
        units:
          - { id: s2a, type: su76m, hex: "2911" }
          - { id: s2b, type: su76m, hex: "3011" }
          - { id: s2c, type: rifle_co, carriedBy: s2t }
          - { id: s2d, type: rifle_co, carriedBy: s2u }
          - { id: s2t, type: zis5, hex: "3110" }
          - { id: s2u, type: zis5, hex: "3210" }
      # Riflemen by the hill, the guns and the heavy mortars.
      - id: s3
        discipline: free
        units:
          - { id: s3a, type: rifle_co, hex: "2311" }
          - { id: s3b, type: rifle_co, hex: "2612" }
          - { id: s3c, type: zis3, hex: "3012" }
          - { id: s3d, type: pm38, hex: "3113" }
          - { id: s3t, type: zis5, hex: "2811" }

# What a player is told before the first turn. No rule reads it. Marnov is an invented place and this action
# is invented. Original text, written for this project.
briefing:
  title: "The Marnov Road"
  date: "August 1943"
  place: "the Eastern Front"
  picture: engraving-wrecks
  background: >-
    Late summer. The front has begun to move, and your battle group is sent east along the open steppe road
    to hold the ground west of Marnov while the army behind it regroups.
  situation: >-
    Your column and a Soviet tank column meet on the open road. There is almost nowhere to hide: a small wood
    stands beside the road, Hill 161 looks out over everything, and Marnov lies beyond it. Whoever holds the
    hill holds the road.
  note: "The forces are of the kind that met that summer; the place and this action are invented."
  sides:
    - side: german
      short: "German"
      mark: cross
      aim: "Take Hill 161 and hold the wood. Your guns reach farther, so make him cross the open to you."
      formations:
        - { id: g1, role: "tank company" }
        - { id: g2, role: "grenadier battalion" }
        - { id: g3, role: "support" }
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Take Hill 161 and Marnov first. His guns reach farther, so close in fast."
      formations:
        - { id: s1, role: "tank battalion" }
        - { id: s2, role: "motor rifles" }
        - { id: s3, role: "support" }
  objectives:
    - { hex: "1808", name: "The wood by the road" }
    - { hex: "2111", name: "Hill 161" }
    - { hex: "2810", name: "Marnov" }
