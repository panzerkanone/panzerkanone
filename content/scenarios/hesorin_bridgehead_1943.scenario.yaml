# The Hesorin Bridgehead, October 1943: a bridgehead held against a tank brigade on the open steppe. A German battle
# group holds the north end of the bridge at Hesorin so that the last columns can cross the river, and a Soviet tank
# brigade comes down from Kelenholm to crush the bridgehead and take the bridge. Original content: the situation and
# the forces are invented for this scenario from the unit types of roster v1 (content/units/v1.units.yaml, each
# value derived from cited public facts); the board is this project's own generated board "hesorin_steppe"
# (assets/maps/hesorin_steppe.map.yaml, open steppe by the natural grammar), and the place names are the board's own
# invented names, on no other board.
# No historical engagement is depicted, and no published scenario, board, order of battle or victory rule is
# followed or adapted.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md): on the open steppe only the
# villages and the small woods hide anything, so the brigade waits north of Kelenholm and west of the long low ridge,
# and the bridgehead's armor across the river. The Soviet side attacks and moves first, and is the larger in points
# (127 to 73).
# Levelled on 2026-11-14 between two planning opponents at `normal` (the whole side moving, the same side first
# every turn; docs/review/M7/battles-handover.md): the first draft (break share 0.6) went 66% Soviet over 100 games,
# nearly all by breaking the bridgehead; break share 0.7, 45.5% (200 games); 0.67, 55.0% (200). This file (0.68):
# Soviet share 52.5% over 400 games (47.6 to 57.3), mean last turn 6.9; ends by a break 52% (all 209 Soviet wins), at
# the turn limit 30% (1 to 119) and by the lead 18% (all German); losses 28.5 Soviet and 42.9 German points a game.
# `hard` on both sides (96 games): 60.4% Soviet (50.4 to 69.6), mean last turn 6.8.

format: impulse-scenario/1
id: hesorin-bridgehead-october-1943
name: "The Hesorin Bridgehead, October 1943"
# The level of battle this scenario is (docs/rules/rules-v1.md 1.3): the battle's Battle level.
battle: hesorin
level: battle
ruleset: v1
units: v1
map: { id: hesorin_steppe, hash: "8c2e96e6ad89af9ac76cb3e8bcfec73f2cc220215129bfb076e38fcfefda3659" }
initiative: soviet
freeDeployment: false
# All three are held by the German side at the start.
objectives:
  - { hex: "2816", points: 3, holder: german }   # Hesorin, the village at the north end of the bridge
  - { hex: "2817", points: 2, holder: german }   # the bridge at Hesorin
  - { hex: "2813", points: 1, holder: german }   # the knoll north-east of Hesorin
# A break share of 0.68: at 0.6 the brigade broke the bridgehead in two games of three.
ending: { turns: 8, suddenDeathLead: 50, breakShare: 0.68 }
