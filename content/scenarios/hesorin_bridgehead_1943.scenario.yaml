# What a player is told before the first turn (the briefing panel). No rule reads it. The forces, their points and
# the win conditions are not written here: the panel works them out from the units above and from `ending` and
# `objectives`. Hesorin and this action are invented: the background is period color and claims no real
# engagement. Original text, written for this project.
briefing:
  title: "The Hesorin Bridgehead"
  date: "October 1943"
  place: "the Eastern Front"
  picture: engraving-pontoon-bridge
  background: >-
    The German armies are falling back to the river line. At Hesorin, a battle group holds a small bridgehead on
    the near bank, so that the last columns can cross the bridge. A Soviet tank brigade is racing across the
    steppe to cut them off.
  situation: >-
    Hesorin stands at the north end of the bridge, with open steppe all around it. The Germans have grenadiers
    and anti-tank guns in the village and in the wood beside it. Their armor waits across the river. The Soviet
    tanks come down from Kelenholm, with nothing to hide behind once they leave the village.
  note: "The forces are of the kind that met that month. The place and this action are invented."
  sides:
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Take Hesorin and the bridge before the Germans can cross. Come at the bridgehead from more than one side."
      formations:
        - { id: s1, role: "first tank battalion" }
        - { id: s2, role: "second tank battalion" }
        - { id: s3, role: "motor riflemen" }
    - side: german
      short: "German"
      mark: cross
      aim: "Hold Hesorin and the bridge to the end. Keep the tanks at a distance with the guns, and bring the armor over the river when they close in."
      formations:
        - { id: g1, role: "bridgehead garrison" }
        - { id: g2, role: "armor" }
        - { id: g3, role: "reserve and mortars" }
  objectives:
    - { hex: "2816", name: "Hesorin" }
    - { hex: "2817", name: "Hesorin bridge" }
    - { hex: "2813", name: "The knoll" }
