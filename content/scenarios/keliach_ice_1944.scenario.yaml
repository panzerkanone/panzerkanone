# What a player is told before the first turn (the briefing panel). No rule reads it. The forces,
# their points and the win conditions are not written here: the panel works them out from the units
# above and from `ending` and `objectives`. Keliach, Galowick and this action are invented: the
# background is period color and claims no real engagement. Original text, written for this project.
briefing:
  title: "The Ice at Keliach"
  date: "January 1944"
  place: "the Eastern Front"
  picture: engraving-commanders-view
  background: >-
    Deep winter, and the river at Keliach has frozen hard. In the summer the bridges decided
    everything. Now the ice will carry a tank almost anywhere along the river, and a Soviet rifle
    division with a tank brigade is ready to cross.
  situation: >-
    Keliach stands on the west bank at the end of the south bridge. Across the river are the village
    of Galowick and Hill 144 above it. South of Galowick the river bends, and whoever stands on the ice
    there holds the crossing. Any unit can cross the frozen river away from the bridges, but it costs
    more movement than open ground.
  note: "The forces are of the kind that met that winter. The place and this action are invented."
  sides:
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Cross the ice and take the bend, Galowick and Hill 144, and keep Keliach. Your tanks do not need the bridges."
      formations:
        - { id: s1, role: "west rifle battalion" }
        - { id: s2, role: "east rifle battalion" }
        - { id: s3, role: "tank brigade" }
        - { id: s4, role: "guns and mortars" }
        - { id: s5, role: "two tank companies" }
    - side: german
      short: "German"
      mark: cross
      aim: "Hold Galowick and Hill 144, and take Keliach back. The river will not stop their tanks, so watch the whole bank."
      formations:
        - { id: g1, role: "the south bridge" }
        - { id: g2, role: "Galowick" }
        - { id: g3, role: "tank reserve" }
        - { id: g4, role: "armored infantry" }
  objectives:
    - { hex: "1809", name: "Keliach" }
    - { hex: "2312", name: "The bend in the river" }
    - { hex: "2308", name: "Galowick" }
    - { hex: "2605", name: "Hill 144" }
