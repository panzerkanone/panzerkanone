# The Ice at Keliach, January 1944: a river crossed on the ice. Original content: the situation and
# the forces are invented for this scenario from the unit types of roster v1
# (content/units/v1.units.yaml, each value derived from cited public facts); the board is this
# project's own generated board "farmland_river_winter" (assets/maps/farmland_river_winter.map.yaml,
# the ground of "farmland_river" printed for winter), and the place names are the board's own
# invented names. No historical engagement is depicted, and no published scenario, board, order of
# battle or victory rule is followed or adapted.
# On a winter board the river is frozen (the lead's ruling 83, rules-v1 6.10): every mover type may
# cross it anywhere, at a cost, where in summer only the two bridges carried tanks. The German side
# holds Galowick and Hill 144 across the river; the Soviet side holds Keliach on the near bank, empty,
# and moves first from behind the hills to the south. The bend of the river south of Galowick is held
# by whoever stands on the ice there. Each side must cross the river to take what the other holds.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md). Battle size:
# 18 units a side for the Soviet side (140 points), 15 for the German (94).
# Levelled on 2026-11-14 between two planning opponents at `normal` (the whole side moving, the same
# side first every turn, 200 games a measure; docs/review/M7/winter2-handover.md has every measure).
# With the German side holding all three objectives at the start, the Soviet attack stalled short of
# them and the German side won every game by its lead. With Keliach the Soviet side's and the bend
# held by nobody, a battle: 55.5% Soviet with the break at 0.6 of the starting points, 45.5% at 0.65,
# 45.0% with one Soviet self-propelled gun fewer. This file (the break at 0.62): Soviet share 52.0%
# (45.1 to 58.8) on seeds 1 to 200 and 48.0% (41.2 to 54.9) on seeds 201 to 400, mean last turn 6.9;
# the Soviet side wins by a break, the German side by its lead or at the turn limit. At `hard`: 77.0%
# Soviet (100 games). The Soviet side crosses the river away from the bridges about three times a game,
# on foot and in tanks, and holds the bend at the end of nearly every game.
# Levelled again on 2026-11-15 for the lead's rulings 84 (a side's units are made Ready when its own turn begins) and
# 85 (heavy machine-gun platoons), with the planning opponent that sets its whole side's fire discipline alike
# (docs/review/M7/levels2-handover.md): as it stood it went 7.0% Soviet over 200 games at `normal` (4.2 to 11.4;
# measured before that change of the opponent), the German side winning by its lead (59%) or at the turn limit; the
# same file under the old timing of Ready (end phase) went 52.0%. The German Tiger platoon out (g3d) and a Maxim
# platoon with each rifle battalion (s1m, s2m): 14.5%; two more T-34 companies behind the tank brigade (s5a, s5b):
# 39.5%; a third: 43.3% over 400; that and the bend worth 2: 57.3% over 400; nine turns in its place 70.5%. With two
# T-34 companies more and the bend worth 2 (it was 1), this file: Soviet share 51.7% over 400 games (46.9 to 56.6), mean
# last turn 7.1; the Soviet side wins by a break (43%, 172:0), the German side at the turn limit (45%, 35:146) or by
# its lead (12%, 0:47). At `hard` on both sides 78.1% Soviet (96 games; 77.0% before ruling 84). Forces 176 Soviet
# points to 78 German. The guns: the Soviet ZiS-3s stand behind the hills, one with the west battalion (1516) with no
# truck, the other with the east battalion (2016) with its ZIS-5 beside it (2116), where that battalion's Maxim platoon
# stands too; the west battalion's Maxim platoon is beside its gun (1416); the PM-38 has its ZIS-5 beside it (1218,
# 1318). The German Pak 40s are dug in at the south bridge's far end (2209) and in Galowick (2308), with no truck of
# their own; the GrW 42 is beside Galowick (2306) with the Opel Blitz beside it (2305).

format: impulse-scenario/1
