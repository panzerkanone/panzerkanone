# The Keliach Bridges, June 1943: an offensive, the battle's largest level (docs/rules/rules-v1.md 1.3). The
# attack the bridges were wanted for comes: a German armored battle group of two tank columns, assault guns
# and two grenadier battalions crosses the river by both bridges against a reinforced Soviet rifle regiment
# with two tank battalions, which holds Keliach, the hill above the north bridge, the ridge south of the
# village and Nestgard. Every unit is on the board from the first turn: the rules have no reinforcements.
# Original content: the situation and the forces are invented for this scenario from the unit types of
# roster v1 (content/units/v1.units.yaml, each value derived from cited public facts); the board is this
# project's own generated board "farmland_river" (assets/maps/farmland_river.map.yaml), and the place names
# are the board's own invented names. No historical engagement is depicted, and no published scenario,
# board, order of battle or victory rule is followed or adapted.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md): the starting places
# were found by placing each unit, in turn, on the nearest hex to where it was meant to stand that no enemy
# unit placed so far could see.
# Levelled on 2026-11-14 between two planning opponents at `normal` (the whole side moving, the same side
# first every turn; the planning opponent that no longer throws tanks beside rifle companies): the first
# draft went 71.0% German over 100 games; with five more rifle companies by Keliach and the north bridge
# 30.0%, with three more in Keliach 36.0%; with two more in Keliach (s9a, s9b):
# German share 48.0% over 200 games (41.2 to 54.9), mean last turn 10.9; ends at the turn limit 86%, by a
# break 10% (all German), by the lead 5% (all Soviet).
# (docs/review/M7/levels-handover.md.)
# Levelled again on 2026-11-15 for the lead's rulings 84 (a side's units are made Ready when its own turn begins) and
# 85 (heavy machine-gun platoons), with the planning opponent that sets its whole side's fire discipline alike
# (docs/review/M7/levels2-handover.md): as it stood it went 35.3% German at `normal` (21.5 to 52.1, on 34 games,
# measured before that change of the opponent). One of Keliach's two added rifle companies a Maxim platoon instead
# (s9m) and an MG 42 platoon with the half-track grenadier battalion (g6m): 43.0% over 100 games (33.7 to 52.8); and
# one T-34 company fewer in the first tank battalion at Nestgard (s4c), as in the Battle level, this file: German share
# 50.0% over 200 games (43.1 to 56.9), mean last turn 11.0; ends at the turn limit 95% (91:99), by a break 5% (9:0).
# At `hard` on both sides 97.9% German (48 games; the German side breaks the regiment in 44; 100% before ruling 84).
# Forces 260 German points to 251 Soviet. The guns: the German Pak 40s stand with the assault guns behind Hill 144
# (2606, 2706) and have no truck of their own; the GrW 42s are with the foot grenadiers, one with an Opel Blitz
# beside it (2906, 3005), the other four hexes from the nearer truck (2909); the MG 42 platoon is beside its
# battalion's half-track (2905, 2904). The Soviet ZiS-3s are dug in at Keliach (1807), on the hill above the north
# bridge (1405, 1407), on the ridge south of Keliach (1814, 2014) and before Nestgard (1313); the two PM-38s are in the
# wood west of the hill (0908, 0808); the Soviet side has no transport.

