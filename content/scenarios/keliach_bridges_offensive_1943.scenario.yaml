# What a player is told before the first turn (the briefing panel). No rule reads it. Keliach, Nestgard and
# this action are invented: the background is period color and claims no real engagement. Original text,
# written for this project.
briefing:
  title: "The Keliach Bridges"
  date: "June 1943"
  place: "the Eastern Front"
  picture: engraving-gun-battery
  background: >-
    Early summer, and the attack the bridges were wanted for has come. A whole German armored battle
    group is on the east bank, with orders to cross at both bridges and drive on to Nestgard.
  situation: >-
    A reinforced Soviet rifle regiment holds the far bank: guns on the hill above the north bridge,
    Keliach fortified, a second battalion on the ridge south of it, a third by Hill 53, and two tank
    battalions waiting behind them. Tanks and guns can cross only by the bridges. Infantry can wade.
  note: "The forces are of the kind that met that month. The place and this action are invented."
  sides:
    - side: german
      short: "German"
      mark: cross
      aim: "Take both bridges and Keliach, then the ridge and Nestgard beyond. Hold what you take to the end."
      formations:
        - { id: g1, role: "north column" }
        - { id: g2, role: "north column's grenadiers" }
        - { id: g3, role: "south column" }
        - { id: g4, role: "heavy tanks" }
        - { id: g5, role: "assault guns and antitank guns" }
        - { id: g6, role: "armored grenadiers" }
        - { id: g7, role: "grenadiers and mortars" }
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Hold the bridges, Keliach, the ridge and Nestgard. Shoot the enemy tanks as they cross, and keep your own tanks back until they are needed."
      formations:
        - { id: s1, role: "Keliach garrison" }
        - { id: s2, role: "the hill" }
        - { id: s3, role: "rifles and mortars" }
        - { id: s4, role: "first tank battalion" }
        - { id: s5, role: "the ridge" }
        - { id: s6, role: "Hill 53" }
        - { id: s7, role: "second tank battalion" }
        - { id: s8, role: "reserve" }
        - { id: s9, role: "Keliach's reinforcements" }
  objectives:
    - { hex: "1402", name: "The north bridge" }
    - { hex: "2009", name: "The south bridge" }
    - { hex: "1809", name: "Keliach" }
    - { hex: "1915", name: "The ridge" }
    - { hex: "1115", name: "Nestgard" }
