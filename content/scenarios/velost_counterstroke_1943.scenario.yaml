          - { id: g1b, type: tiger1e, hex: "2919" }
          - { id: g1c, type: stug3g, hex: "3117" }
      # A tank company of three Pz IV H platoons and a StuG III G platoon, on the road from the east.
      - id: g2
        discipline: free
        units:
