# What a player is told before the first turn (the briefing panel). No rule reads it. The forces, their points and
# the win conditions are not written here: the panel works them out from the units above and from `ending` and
# `objectives`. Velost and this action are invented: the background is period color and claims no real
# engagement. Original text, written for this project.
briefing:
  title: "The Velost Counterstroke"
  date: "September 1943"
  place: "the Eastern Front"
  picture: engraving-rail-yard
  background: >-
    Yesterday a Soviet tank brigade broke through the German line and drove south through the forest. It took
    the small town of Velost and the bridge beside it. Its infantry and guns are still far behind. A German
    armored battle group is sent to strike the brigade before they arrive.
  situation: >-
    Velost lies on the road behind the river, among woods and low hills, with the village of Korenel to the
    east. The Soviet tanks wait around the town and the village, with a few riflemen in Velost. The German
    tanks come from the east and south-east, with Tigers in the lead.
  note: "The forces are of the kind that met that month. The place and this action are invented."
  sides:
    - side: german
      short: "German"
      mark: cross
      aim: "Destroy the Soviet tanks and retake Velost, its bridge and Korenel. Use the woods and hills to close in, then let your longer guns do the work."
      formations:
        - { id: g1, role: "heavy company" }
        - { id: g2, role: "tank company" }
        - { id: g3, role: "armored infantry" }
    - side: soviet
      short: "Soviet"
      mark: hammer-sickle
      aim: "Hold Velost, the bridge and Korenel until your infantry arrives. Fight the Tigers at close range, where your guns can hurt them."
      formations:
        - { id: s1, role: "first tank battalion" }
        - { id: s2, role: "second tank battalion" }
        - { id: s3, role: "Velost garrison" }
  objectives:
    - { hex: "1916", name: "Velost" }
    - { hex: "1716", name: "Velost bridge" }
    - { hex: "2317", name: "Korenel" }
