# The Velost Counterstroke, September 1943: a tank battle in wooded hills. A Soviet tank brigade broke through the
# German line the day before and took the town of Velost, its bridge and the village of Korenel, but its infantry
# and guns are still far behind; a German armored battle group with Tigers strikes it from the east and south-east
# before they arrive. Most of both sides is armor. Original content: the situation and the forces are invented for
# this scenario from the unit types of roster v1 (content/units/v1.units.yaml, each value derived from cited public
# facts); the board is this project's own generated board "velost_woods" (assets/maps/velost_woods.map.yaml, wooded
# hills by the natural grammar, with Velost a town of three hexes), and the place names are the board's own invented
# names, on no other board.
# No historical engagement is depicted, and no published scenario, board, order of battle or victory rule is
# followed or adapted.
# The set-up puts no unit in sight of an enemy unit (ruling 72 in docs/bars/M2a.md): the German tanks wait behind
# the hills and woods east and south-east of Korenel. The German side attacks and moves first; the Soviet brigade
# is the larger in points (117 to 105) and the German the longer in reach (Tigers and Pz IV H against T-34s).
# Levelled on 2026-11-14 and 15 between two planning opponents at `normal` (the whole side moving, the same side
# first every turn; docs/review/M7/battles-handover.md). This battle's first idea, a Soviet tank raid on a German rear
# area (a mortar park, its trucks and guns at Velost, an armored reserve behind the hills), went 0% to 12% Soviet in
# six set-ups and 100% once the reserve was taken out: the planning opponent's raiders shot up everything in the
# open and never drove onto an objective, so it was given up for this fight. The counterstroke's first draft (break
# share 0.6) went 59% German over 100 games; break share 0.65, 43.0% (200); one Pz IV H platoon fewer, 27.5%; 0.62,
# 50.0%; 0.63, 50.5%. This file (0.62): German share 46.3% over 400 games (41.4 to 51.1), mean last turn 7.0; ends
# by a break 57% (183 German wins to 43), at the turn limit 33% (2 to 129) and by the lead 11% (all Soviet); losses
# 36.8 German and 65.3 Soviet points a game: the Tigers and Pz IVs win by destroying the brigade's tanks, the brigade
# by holding its three places to the end. `hard` on both sides (96 games): 78.1% German (68.9 to 85.2), mean last
# turn 6.3.

format: impulse-scenario/1
id: velost-counterstroke-september-1943
name: "The Velost Counterstroke, September 1943"
# The level of battle this scenario is (docs/rules/rules-v1.md 1.3): the battle's Battle level.
battle: velost
level: battle
ruleset: v1
units: v1
map: { id: velost_woods, hash: "a86ba13acbb3e607f87aefbecfc2557e20028d005bbae5e772bc39224bbfcb77" }
initiative: german
freeDeployment: false
# All three are held by the Soviet side at the start: the brigade took them the day before.
objectives:
  - { hex: "1916", points: 2, holder: soviet }   # Velost, the town of three hexes
  - { hex: "1716", points: 2, holder: soviet }   # the bridge west of Velost, the brigade's way back over the river
  - { hex: "2317", points: 2, holder: soviet }   # Korenel, where the road from the south joins
ending: { turns: 8, suddenDeathLead: 50, breakShare: 0.62 }
sides:
  - id: german
    name: "German armored battle group"
    counters: stock-a
    orders: 3
    zone: [["2501", "3321"]]
    formations:
      # The heavy company: two Tiger platoons and a StuG III G platoon, behind the hills south-east of Korenel.
      - id: g1
        discipline: free
        units:
