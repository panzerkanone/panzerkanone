          - { id: g2b, type: pz4h, hex: "3213" }
          - { id: g2c, type: pz4h, hex: "3114" }
          - { id: g2d, type: stug3g, hex: "3210" }
      # Armored infantry: two grenadier companies in half-tracks and a machine-gun platoon with a truck.
      - id: g3
        discipline: free
        units:
