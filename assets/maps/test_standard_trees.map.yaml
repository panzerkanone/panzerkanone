# Standard Test Board, Tree Sides: a hand-made board. It is the Standard Test Board
# (assets/maps/test_standard.map.yaml) with every woods hex of its cover layer made open ground,
# and its woods placed again by hand as tree sides (the `trees` layer at the end): thirteen woods,
# listed in docs/review/M3b/tree-sides-handover.md. Original content: invented terrain and invented
# place names. No generator command reproduces this file, so it has no `source`;
# tests/mapart/treeSides.test.ts holds everything but its cover and its trees to the standard board.

format: map/1
layout: flat-top
id: test_standard_trees
name: "Standard Test Board, Tree Sides"
cols: 33
rows: 21
artSeed: 2998512746

# The two layers: one text row per board row, top row first; one character per
# column, column 01 first. On the board, even-numbered columns sit half a hex lower.
#   elevation:  .  level ground   H  hilltop
