# trees: tree sides. Woods are a hexside feature, as slopes are: each entry sets one hexside
# for trees, with a strength (above 0, at most 3; 1 is an ordinary side). A side is named by a
# hex and one of its six sides, N NE SE S SW NW (N and S are the level ones): by the hex for
# which it faces N, NE or SE, or on the board's own edge by the hex it belongs to. Nothing else
# is stored: a hex is a tree hex when any of its sides is set, and the art derives the rest.
