# A hex is named by the label printed on it: column then row ("0412" is column 4, row 12).
# A slope is not a hex. It is the hill area around a crest, and a crest is a hexside:
# every edge of a hilltop is one, and a ridge is a chain of them across level ground.
# ridges: each ridge is its chain of crest edges; an edge is the pair of hexes it runs between.
ridges:
  - [["1805", "1804"], ["1905", "1804"], ["1905", "1904"]]

# roads and rivers run hex to hex. A road leaves the map at each exit; a river end on the
# board edge runs off the map.
# A river whose last hex is a hex of another river joins it there: a junction.
